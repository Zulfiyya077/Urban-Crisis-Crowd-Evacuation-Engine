<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title data-i18n="title.operator">Dispetçer · Bakı</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="/css/operator.css" />
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <img class="logo" src="/logo.svg" alt="" width="36" height="36" />
        <div>
          <h1 data-i18n="operator.title">Dispetçer</h1>
        </div>
      </div>
      <dl class="stats" id="stats"></dl>
      <div class="lang" role="group" data-i18n-aria="lang.group" aria-label="Dil">
        <button type="button" data-set-lang="az" data-i18n-aria="lang.az" aria-label="Azərbaycan dili" aria-pressed="true">
          <span class="flag" data-flag="az"></span><span>AZ</span>
        </button>
        <button type="button" data-set-lang="en" data-i18n-aria="lang.en" aria-label="English" aria-pressed="false">
          <span class="flag" data-flag="en"></span><span>EN</span>
        </button>
      </div>
      <div class="top-side">
        <time id="clock"></time>
        <a href="/" data-i18n="nav.citizen">Vətəndaş səhifəsi</a>
      </div>
      <button type="button" id="gate-out" hidden data-i18n="gate.out">Çıxış</button>
    </header>
    <form id="gate" class="gate">
      <p data-i18n="gate.need">Briqada və yol üçün giriş</p>
      <label>
        <span data-i18n="gate.user">İstifadəçi</span>
        <input id="gate-user" name="username" autocomplete="username" required />
      </label>
      <label>
        <span data-i18n="gate.pass">Şifrə</span>
        <input id="gate-pass" name="password" type="password" autocomplete="current-password" required />
      </label>
      <button type="submit" data-i18n="gate.in">Giriş</button>
    </form>
    <div id="alarms"></div>
    <div id="result" class="result" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <button type="button" data-tab="map" class="is-on" data-i18n="tab.map">Xəritə</button>
      <button type="button" data-tab="feed" data-i18n="tab.feed">SOS</button>
      <button type="button" data-tab="resources" data-i18n="tab.resources">Resurslar</button>
    </nav>
    <div class="board" data-tab="map">
      <section class="col feed-col" aria-label="SOS lenti">
        <header class="col-head"><h2 data-i18n="feed.title">SOS siqnalları</h2></header>
        <div id="zones" class="zones"></div>
        <div id="feed" class="scroll"></div>
      </section>
      <section class="map-cell" aria-label="Canlı xəritə"><div id="map"></div></section>
      <aside id="detail" class="detail" aria-label="Seçilmiş siqnal"></aside>
      <details class="tools">
        <summary data-i18n="section.tools">Resurslar</summary>
        <div class="scroll" id="resources"></div>
      </details>
    </div>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script type="module" src="/js/operator.js"></script>
</body>
</html>
